<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reimbursement · Expense Portal</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">Expense Portal</div>
    <nav>
      <a class="nav-link" href="index.html">Dashboard</a>
      <a class="nav-link active" href="reimbursement.html">Reimbursement</a>
      <a class="nav-link" href="purchase.html">Purchase Request</a>
      <a class="nav-link" href="my-requests.html">My Requests</a>
      <a class="nav-link" href="approvals.html" data-role-link="approvals" hidden>Approvals</a>
      <a class="nav-link" href="admin.html" data-role-link="admin" hidden>Admin</a>
    </nav>
    <div class="sidebar-foot">V1 Demo · Local Storage</div>
  </aside>
  <main class="main">
    <header class="topbar"><div><p class="eyebrow">Expense</p><h1>Reimbursement</h1></div></header>
    <section class="panel form-panel">
      <form id="reimbursementForm" class="form-grid">
        <label>Requester<input name="requester" required placeholder="Name" /></label>
        <label>Department<input name="department" required placeholder="Operations" /></label>
        <label>Expense date<input type="date" name="expenseDate" required /></label>
        <label>Category<select name="category" id="reimCategory" required>
          <option value="">Select</option><option>Business Travel</option><option>Food</option><option>Transportation</option><option>Office Supplies</option><option>Parking</option><option>Fuel</option><option>Other</option>
        </select></label>
        <label>Amount (KRW)<input type="number" name="amount" min="0" required placeholder="50000" /></label>
        <label>Receipt / document<input type="file" name="attachment" /></label>
        <label class="full">Business purpose<textarea name="purpose" rows="4" required placeholder="Describe why this expense was necessary"></textarea></label>
        <div id="vehicleFields" class="full conditional hidden">
          <h3>Vehicle details</h3>
          <div class="form-grid compact">
            <label>Departure<input name="departure" /></label>
            <label>Destination<input name="destination" /></label>
            <label>Distance (km)<input type="number" step="0.1" name="distance" /></label>
            <label>Parking / toll<input type="number" name="parkingToll" /></label>
          </div>
        </div>
        <div class="full form-actions"><button class="btn primary" type="submit">Submit reimbursement</button></div>
      </form>
    </section>
  </main>
</div>
<script src="js/common.js"></script>
<script src="js/reimbursement.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>requireAuth();</script>
</body>
</html>

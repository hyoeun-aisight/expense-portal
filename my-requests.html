<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Requests · Expense Portal</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/v6.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">Expense Portal</div>
    <nav>
      <a class="nav-link" href="index.html">Dashboard</a>
      <a class="nav-link" href="reimbursement.html">Reimbursement</a>
      <a class="nav-link" href="purchase.html">Purchase Request</a>
      <a class="nav-link active" href="my-requests.html">My Requests</a>
      <a class="nav-link" href="approvals.html" data-role-link="approvals" hidden>Approvals</a>
      <a class="nav-link" href="admin.html" data-role-link="admin" hidden>Admin</a>
    </nav>
    <div class="sidebar-foot">Supabase · Shared Data</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div><p class="eyebrow">Tracking</p><h1>My Requests</h1></div>
    </header>

    <section class="panel">
      <div class="v6-tabs" role="tablist" aria-label="Request type">
        <button class="v6-tab active" id="purchaseTab" type="button">Purchase Requests</button>
        <button class="v6-tab" id="reimbursementTab" type="button">Reimbursements</button>
      </div>

      <div class="v6-filter-grid">
        <label>Status
          <select id="statusFilter"><option value="all">All statuses</option></select>
        </label>
        <label>From
          <input id="dateFrom" type="date">
        </label>
        <label>To
          <input id="dateTo" type="date">
        </label>
        <button class="btn" id="clearFilters" type="button">Clear filters</button>
      </div>

      <div class="table-wrap">
        <table class="v6-table">
          <thead>
            <tr>
              <th>Request</th>
              <th>Amount</th>
              <th>Status</th>
              <th>Route</th>
              <th>Created</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="requestRows"><tr><td colspan="6" class="muted">Loading...</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/common.js"></script>
<script src="js/my-requests.js?v=6"></script>
</body>
</html>
